# Разрешение установочных скриптов для отдельных пакетов.
# По умолчанию pnpm их блокирует — это защита от вредоносного кода
# в зависимостях. Разрешаем только то, чему действительно нужно
# собрать бинарник под текущую операционную систему.
allowBuilds:
  # Сборщик, на котором работает tsx: запуск TypeScript-скриптов и worker
  esbuild: true
  # Нативный резолвер путей для eslint-plugin-import
  unrs-resolver: true
